global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # SeaTunnel targets come from STX HTTP SD.
  # SeaTunnel 抓取目标由 STX HTTP SD 提供。
  - job_name: seatunnel_engine_http
    metrics_path: /hazelcast/rest/instance/metrics
    http_sd_configs:
      - url: http://stx-backend:17800/api/v1/monitoring/prometheus/discovery
        refresh_interval: 30s
