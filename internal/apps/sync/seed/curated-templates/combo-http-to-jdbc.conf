# combo · HTTP → JDBC
# curated-section: combo | Http,Jdbc | single
# source: https://seatunnel.apache.org/zh-CN/docs/3.0.0/getting-started/recipes/http-to-jdbc
#
# 来自 SeaTunnel 3.0.0 官方场景教程，主机名/账号为文档示例，接入前请按环境替换。
# From SeaTunnel 3.0.0 official recipes; replace hosts/credentials for your environment.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Http {
    plugin_output = "http_orders"
    url = "http://mockserver:1080/example/http"
    method = "GET"
    format = "json"
    schema = {
      fields {
        c_string = string
        c_int = int
      }
    }
  }
}

sink {
  Jdbc {
    plugin_input = "http_orders"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://postgresql:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    generate_sink_sql = true
    database = "test"
    table = "public.http_orders"
    primary_keys = ["c_string"]
    batch_size = 100
  }
}
