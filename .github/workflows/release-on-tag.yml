name: Release on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# 并发控制：同一 tag 重新推送时取消旧构建，避免陈旧构建阻塞或覆盖新产物
# Concurrency: cancel obsolete in-progress runs when retrying the same tag
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  package-release:
    name: Package split release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build split release assets
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x install/package-release.sh install/install-online.sh install/download-bundle.sh
          # 版本发版只打 stx / agent / frontend。Node 与三件套走 release-deps.yml 的 deps tag。
          # Version tags ship stx / agent / frontend only. Node and observability live on the deps tag.
          install/package-release.sh \
            --arch all \
            --layout split \
            --build-frontend \
            --version "${APP_VERSION}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stx-packages-${{ github.ref_name }}
          path: dist/releases/**
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs: package-release

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: stx-packages-${{ github.ref_name }}
          path: release-assets

      - name: Show release assets
        run: ls -alh release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # stx-linux-* / stx-agent-linux-* 已含配对 .sha256，不要再加 *.sha256，否则同一资产上传两次会 404。
          # stx-linux-* / stx-agent-linux-* already include paired .sha256; do not add *.sha256 or the duplicate upload 404s.
          files: |
            release-assets/stx-linux-*
            release-assets/stx-agent-linux-*
            release-assets/frontend-standalone-*.tar.gz
            release-assets/frontend-standalone-*.tar.gz.sha256
            release-assets/SHA256SUMS
            release-assets/install-online.sh
            release-assets/download-bundle.sh
            release-assets/stx-install-helpers.tar.gz
            release-assets/stx-docker-compose.tar.gz
            release-assets/stx-install-helpers.tar.gz.sha256
            release-assets/stx-docker-compose.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: false

  # 原生并发构建镜像（Native Matrix）：在原生硬件 Runner 上完全无仿真并行构建
  # Native matrix image build: compile natively on dedicated hardware runners without QEMU emulation
  build-container-images-native:
    name: Build ${{ matrix.image_name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: package-release
    strategy:
      fail-fast: false
      matrix:
        image_name: [stx-backend, stx-frontend, stx-all-in-one]
        arch: [amd64, arm64]
        include:
          - image_name: stx-backend
            dockerfile: .github/docker/Dockerfile.backend
          - image_name: stx-frontend
            dockerfile: .github/docker/Dockerfile.frontend
          - image_name: stx-all-in-one
            dockerfile: .github/docker/Dockerfile.all-in-one
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 原生单架构构建并通过 digest 推送，避免临时 tag 污染命名空间
      # Native single-arch build and push by digest to avoid tag pollution
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false

      # 将生成的 digest 保存为产物传递给合并阶段
      # Export image digest as artifact for the merge stage
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image_name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 轻量 Manifest 合并与双端发布（Merge & Publish）：使用 docker buildx imagetools 秒级组装多架构清单并推送到 GHCR 和华为云 SWR
  # Lightweight manifest merge and dual registry publish: assemble multi-arch manifest list in seconds via imagetools
  merge-container-images:
    name: Merge and Publish ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs: build-container-images-native
    env:
      SWR_REGISTRY: swr.cn-east-3.myhuaweicloud.com
      SWR_NAMESPACE: stx
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: stx-backend
          - image_name: stx-frontend
          - image_name: stx-all-in-one

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image_name }}-*
          merge-multiple: true

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Huawei SWR
        env:
          SWR_USER: ${{ secrets.SWR_USERNAME }}
          SWR_PASS: ${{ secrets.SWR_PASSWORD }}
        if: env.SWR_USER != '' && env.SWR_PASS != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ env.SWR_USER }}
          password: ${{ env.SWR_PASS }}

      - name: Compute images to publish
        id: images
        env:
          SWR_USER: ${{ secrets.SWR_USERNAME }}
          SWR_PASS: ${{ secrets.SWR_PASSWORD }}
        run: |
          IMAGES="ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}"
          if [[ -n "$SWR_USER" && -n "$SWR_PASS" ]]; then
            IMAGES="${IMAGES}"$'\n'"${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/${{ matrix.image_name }}"
          fi
          {
            echo "list<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_REPO="ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}"
          
          # 递归收集各架构 digest，兼容平铺或子目录解压结构
          # Recursively collect architecture digests, compatible with flat or nested artifact extractions
          DIGEST_ARGS=()
          for digest in $(find /tmp/digests -type f -exec basename {} \; | sort -u); do
            [[ -n "$digest" ]] && DIGEST_ARGS+=("${IMAGE_REPO}@sha256:${digest}")
          done

          echo "[INFO] Found ${#DIGEST_ARGS[@]} digests for ${IMAGE_REPO}:"
          for d in "${DIGEST_ARGS[@]}"; do
            echo "  - $d"
          done

          if [[ "${#DIGEST_ARGS[@]}" -lt 2 ]]; then
            echo "[ERROR] Expected at least 2 digests (amd64, arm64), but found ${#DIGEST_ARGS[@]}" >&2
            exit 1
          fi

          # 逐行读取 Docker metadata 生成的多行 Tags，构造 -t 参数数组，避免多行模板展开语法错误
          # Read multiline tags from Docker metadata line by line into -t parameter array to avoid template syntax errors
          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && TAG_ARGS+=("-t" "$tag")
          done <<< "$TAGS"

          echo "[INFO] Creating and pushing multi-arch manifest for ${IMAGE_REPO}..."
          for ((i=0; i<${#TAG_ARGS[@]}; i+=2)); do
            echo "  Target tag: ${TAG_ARGS[i+1]}"
          done

          # docker buildx imagetools create 秒级合并并推送到所有目标仓库
          # docker buildx imagetools create merges and pushes to all target registries in seconds
          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_ARGS[@]}"

      - name: Inspect final multi-arch manifest
        run: |
          PRIMARY_TAG="ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}:${{ github.ref_name }}"
          docker buildx imagetools inspect "${PRIMARY_TAG}"
