# 公共服务：控制面 + 监控（不含数据库）
# Shared: control plane + monitoring (no database)
#
# Observability YAML is generated from install/observability templates:
#   ./install/observability/render.sh docker deploy/docker/observability
# 监控配置由 install/observability 模板生成，勿手改 observability/ 下文件。
#
# Persistent data uses relative bind mounts under ./data/ (not named volumes).
# 持久化数据使用 ./data/ 相对路径绑定，不用 named volume。

name: stx

services:
  # 镜像前缀：海外 ghcr.io/leonyoah；中国华为云 SWR 用 swr.cn-east-3.myhuaweicloud.com/stx（见 .env）。
  # Image prefix: GHCR overseas; China Huawei SWR uses swr.cn-east-3.myhuaweicloud.com/stx (see .env).
  stx-backend:
    image: ${STX_IMAGE_REGISTRY:-ghcr.io/leonyoah}/stx-backend:${STX_IMAGE_TAG:-latest}
    container_name: stx-backend
    restart: unless-stopped
    volumes:
      - ./config.yaml:/opt/stx/config.yaml:ro
      - ./data/stx:/opt/stx/data
      - ./data/stx-lib:/opt/stx/lib
    ports:
      - "17800:17800"
      - "17890:17890"
    networks: [stx]

  stx-frontend:
    image: ${STX_IMAGE_REGISTRY:-ghcr.io/leonyoah}/stx-frontend:${STX_IMAGE_TAG:-latest}
    container_name: stx-frontend
    restart: unless-stopped
    environment:
      PORT: "17880"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_BACKEND_BASE_URL: ${STX_BACKEND_PUBLIC_URL:-http://127.0.0.1:17800}
    ports:
      - "17880:17880"
    depends_on:
      stx-backend:
        condition: service_started
    networks: [stx]

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: stx-prometheus
    restart: unless-stopped
    user: "${PROMETHEUS_USER:-0:0}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - stx-backend
    networks: [stx]

  alertmanager:
    image: prom/alertmanager:v0.31.1
    container_name: stx-alertmanager
    restart: unless-stopped
    user: "${ALERTMANAGER_USER:-0:0}"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./data/alertmanager:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - stx-backend
    networks: [stx]

  grafana:
    image: grafana/grafana:12.3.3
    container_name: stx-grafana
    restart: unless-stopped
    user: "${GRAFANA_USER:-0:0}"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/api/v1/monitoring/proxy/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_LIVE_MAX_CONNECTIONS: "0"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [stx]

networks:
  stx:
    driver: bridge
