name: Release on Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# 并发控制：同一 tag 重新推送时取消旧构建，避免陈旧构建阻塞或覆盖新产物
# Concurrency: cancel obsolete in-progress runs when retrying the same tag
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  package-release:
    name: Package split release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build split release assets
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x install/package-release.sh install/install-online.sh install/download-bundle.sh
          # 版本发版只打 stx / agent / frontend。Node 与三件套走 release-deps.yml 的 deps tag。
          # Version tags ship stx / agent / frontend only. Node and observability live on the deps tag.
          install/package-release.sh \
            --arch all \
            --layout split \
            --build-frontend \
            --version "${APP_VERSION}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stx-packages-${{ github.ref_name }}
          path: dist/releases/**
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs: package-release

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: stx-packages-${{ github.ref_name }}
          path: release-assets

      - name: Show release assets
        run: ls -alh release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # stx-linux-* / stx-agent-linux-* 已含配对 .sha256，不要再加 *.sha256，否则同一资产上传两次会 404。
          # stx-linux-* / stx-agent-linux-* already include paired .sha256; do not add *.sha256 or the duplicate upload 404s.
          files: |
            release-assets/stx-linux-*
            release-assets/stx-agent-linux-*
            release-assets/frontend-standalone-*.tar.gz
            release-assets/frontend-standalone-*.tar.gz.sha256
            release-assets/SHA256SUMS
            release-assets/install-online.sh
            release-assets/download-bundle.sh
            release-assets/stx-install-helpers.tar.gz
            release-assets/stx-docker-compose.tar.gz
            release-assets/stx-install-helpers.tar.gz.sha256
            release-assets/stx-docker-compose.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: false

  # 发版镜像同时推 GHCR 与华为云 SWR（组织 stx；需 Secrets：SWR_USERNAME / SWR_PASSWORD）。
  # Release images push to GHCR and Huawei SWR (org stx; requires Secrets: SWR_USERNAME / SWR_PASSWORD).
  publish-container-images:
    name: Publish ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs: package-release
    env:
      # 中国固定仓库：华东-上海三 / 组织 stx。
      # Fixed China registry: cn-east-3 / org stx.
      SWR_REGISTRY: swr.cn-east-3.myhuaweicloud.com
      SWR_NAMESPACE: stx
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: stx-backend
            dockerfile: .github/docker/Dockerfile.backend
          - image_name: stx-frontend
            dockerfile: .github/docker/Dockerfile.frontend
          - image_name: stx-all-in-one
            dockerfile: .github/docker/Dockerfile.all-in-one

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 用户名格式：区域@AK，例如 cn-east-3@HPUAKxxxx；密码为 SWR 控制台登录密钥（未配置时跳过）。
      # Username format: region@AK (e.g. cn-east-3@HPUAKxxxx); password is SWR console login key (skipped if not configured).
      - name: Login to Huawei SWR
        if: ${{ secrets.SWR_USERNAME != '' && secrets.SWR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Compute images to publish
        id: images
        env:
          SWR_USER: ${{ secrets.SWR_USERNAME }}
          SWR_PASS: ${{ secrets.SWR_PASSWORD }}
        run: |
          IMAGES="ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}"
          if [[ -n "$SWR_USER" && -n "$SWR_PASS" ]]; then
            IMAGES="${IMAGES}"$'\n'"${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/${{ matrix.image_name }}"
          fi
          {
            echo "list<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
