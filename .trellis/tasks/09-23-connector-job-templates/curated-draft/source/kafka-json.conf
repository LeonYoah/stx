Kafka {
  plugin_output = "kafka_src"
  bootstrap.servers = "127.0.0.1:9092"
  topic = "seatunnel_events"
  consumer.group = "stx_curated_group"
  start_mode = "earliest"
  format = json
  schema = {
    fields {
      id = "bigint"
      name = "string"
      amount = "decimal(18,2)"
      event_time = "timestamp"
    }
  }
}
