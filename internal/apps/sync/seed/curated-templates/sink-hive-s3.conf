# sink · Hive + S3 warehouse
# curated-section: sink | Hive | s3
# 示例使用 InstanceProfile，无需 access_key；若改 SimpleAWSCredentials 再补密钥变量

Hive {
  plugin_input = ["src"]
  table_name = "warehouse.seatunnel_users"
  metastore_uri = "thrift://metastore:9083"
  hive.hadoop.conf-path = "/etc/hadoop/conf"
  hive.hadoop.conf = {
    bucket = "s3a://seatunnel-warehouse"
    fs.s3a.aws.credentials.provider = "com.amazonaws.auth.InstanceProfileCredentialsProvider"
  }
}
