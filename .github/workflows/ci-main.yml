name: CI on main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    name: License Policy Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Check license policy for pull request changes
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_license.py --base-ref "origin/${{ github.base_ref }}" --head-ref "${{ github.sha }}"

      - name: Check license policy for push changes
        if: github.event_name == 'push'
        run: python3 scripts/check_license.py --base-ref "${{ github.event.before }}" --head-ref "${{ github.sha }}"

      - name: Check database dialect compatibility
        run: python3 scripts/check_db_compatibility.py

  # 安装脚本轻量门禁：语法 / shellcheck、安装链路不依赖 python3、download-lib / install-core 单测。
  # Lightweight installer gate: syntax / shellcheck, no python3 in the install path, download-lib / install-core tests.
  install-scripts-test:
    name: Install Scripts Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax and shellcheck
        run: |
          scripts=(install/*.sh install/bin/*.sh install/bin/lib/*.sh scripts/check-release-asset-globs.sh
            scripts/test-release-download-lib.sh scripts/test-yaml-set-differential.sh scripts/release-deps-publish.sh
            scripts/test-release-deps.sh scripts/ci-install-smoke.sh scripts/test-offline-bundle.sh
            scripts/smoke-offline-bundle.sh)
          for f in "${scripts[@]}"; do
            bash -n "$f"
          done
          shellcheck -x -S error "${scripts[@]}"

      - name: actionlint (workflows)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          # 仅检查发版/安装相关工作流（e2e.yml 等已有 shellcheck 风格告警，不在本门禁范围）。
          # Release/install workflows only (e2e.yml etc. carry pre-existing shellcheck style findings).
          ./actionlint -color .github/workflows/release-deps.yml .github/workflows/release-on-tag.yml \
            .github/workflows/ci-main.yml .github/workflows/docker-build-check.yml

      - name: Install path must not depend on python3
        run: |
          if grep -nE '^\s*[^#]*\bpython3\b' install/install.sh install/install-core.sh install/download-lib.sh \
            install/install-online.sh install/download-bundle.sh; then
            echo "[ERROR] installer scripts must not call python3 (target hosts may not have it)" >&2
            exit 1
          fi

      - name: download-lib / install-core tests
        run: bash scripts/test-release-download-lib.sh

      # build-offline-bundle.sh 三个变体的布局 / sha256 / 别名、install.sh 的 Node 选择与 glibc 报错、
      # install-online --bundle-file、alertmanager 单机参数（本地伪产物，无需外网）。
      # build-offline-bundle.sh layout / sha256 / aliases for all variants, install.sh Node selection and glibc
      # errors, install-online --bundle-file, alertmanager single-node args (local fake artifacts, no network).
      - name: offline bundle / observability tests
        run: bash scripts/test-offline-bundle.sh

      # 纯 awk 的 stx_yaml_set 与 v1.2.0 python3 参考实现逐字节差分（~1400 组）。
      # Byte-for-byte differential of the pure-awk stx_yaml_set vs the v1.2.0 python3 reference (~1400 cases).
      - name: stx_yaml_set differential vs python3 reference
        run: bash scripts/test-yaml-set-differential.sh

      # release-deps 安全发布：工作流不删 Release、MANIFEST 合并保留未重建条目、桩 gh 验证上传/切换顺序。
      # Safe deps publishing: no release delete, manifest merge keeps untouched entries, stub-gh upload/swap order.
      - name: release-deps publisher tests
        run: bash scripts/test-release-deps.sh

  # 真实安装冒烟（用 v1.2.0 Release 产物组装离线整包，在无 python3 的 debian:bookworm 中安装）；依赖外网，不进 CI Gate。
  # Real install smoke (bundle assembled from v1.2.0 release assets, installed in python3-free debian:bookworm);
  # network-bound, not gated.
  install-smoke:
    name: Install Smoke no-python3 (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.install == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, systemd, mysql, postgres]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install smoke (${{ matrix.mode }})
        run: bash scripts/ci-install-smoke.sh "${{ matrix.mode }}" v1.2.0

  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      proxy: ${{ steps.filter.outputs.proxy }}
      install: ${{ steps.filter.outputs.install }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend/backend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-main.yml'
              - 'scripts/restart.sh'
            backend:
              - 'internal/**'
              - 'agent/**'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/check_db_compatibility.py'
              - '.github/workflows/ci-main.yml'
              - 'scripts/restart.sh'
            proxy:
              - 'tools/stx-java-proxy/**'
              - '.github/workflows/ci-main.yml'
              - 'scripts/restart.sh'
            install:
              - 'install/**'
              - 'config.example.yaml'
              - 'scripts/stx-java-proxy.sh'
              - 'scripts/ci-install-smoke.sh'
              - 'scripts/smoke-offline-bundle.sh'
              - 'scripts/test-offline-bundle.sh'
              - '.github/workflows/ci-main.yml'

  backend-core-test:
    name: Backend Core & Multi-DB Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stx
          POSTGRES_PASSWORD: stx_password_2026
          POSTGRES_DB: stx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stx_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run backend tests
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_USER: stx
          TEST_POSTGRES_PASSWORD: stx_password_2026
          TEST_POSTGRES_DB: stx
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
          TEST_MYSQL_DB: stx_test
        run: go test ./... -count=1

  agent-test:
    name: Agent Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run agent tests
        run: |
          cd agent
          go test ./... -count=1

  proxy-test:
    name: STX Java Proxy Dual-Epoch Compile
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proxy == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Verify Spotless & Compile Epoch v2 (SeaTunnel 2.3)
        run: |
          mvn -B -f tools/stx-java-proxy/pom.xml -Pepoch-v2 -DskipTests spotless:check compile package

      - name: Compile Epoch v3 (SeaTunnel 3.0)
        run: |
          mvn -B -f tools/stx-java-proxy/pom.xml -P'epoch-v3,!epoch-v2' -DskipTests compile package

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm run test -- --passWithNoTests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build standalone frontend
        run: |
          cd frontend
          pnpm run pack:standalone

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, install-scripts-test, backend-core-test, agent-test, proxy-test, frontend-unit, frontend-build]
    if: always()

    steps:
      - name: Evaluate CI gate
        run: |
          echo "install_scripts_result=${{ needs.install-scripts-test.result }}"
          echo "backend=${{ needs.changes.outputs.backend }}"
          echo "backend_core_result=${{ needs.backend-core-test.result }}"
          echo "agent_result=${{ needs.agent-test.result }}"
          echo "proxy=${{ needs.changes.outputs.proxy }}"
          echo "proxy_result=${{ needs.proxy-test.result }}"
          echo "frontend=${{ needs.changes.outputs.frontend }}"
          echo "frontend_unit_result=${{ needs.frontend-unit.result }}"
          echo "frontend_build_result=${{ needs.frontend-build.result }}"

          if [ "${{ needs.install-scripts-test.result }}" != "success" ]; then
            echo "::error::Install Scripts Tests did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.backend }}" = "true" ] &&
             [ "${{ needs.backend-core-test.result }}" != "success" ]; then
            echo "::error::Backend Core Tests did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.backend }}" = "true" ] &&
             [ "${{ needs.agent-test.result }}" != "success" ]; then
            echo "::error::Agent Tests did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.proxy }}" = "true" ] &&
             [ "${{ needs.proxy-test.result }}" != "success" ]; then
            echo "::error::Java Proxy Dual-Epoch Compile did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.frontend }}" = "true" ] &&
             [ "${{ needs.frontend-unit.result }}" != "success" ]; then
            echo "::error::Frontend Unit Tests did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.frontend }}" = "true" ] &&
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "::error::Frontend Build did not succeed."
            exit 1
          fi

          echo "All required CI suites succeeded."
