env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  Kafka {
    plugin_output = "kafka_raw"
    topic = "orders"
    bootstrap.servers = "kafka:9092"
    consumer.group = "stx-metrics-real-orders"
    start_mode = "earliest"
    format = "json"
    schema = {
      fields {
        data = string
      }
    }
  }
}

transform {
  JsonPath {
    plugin_input = "kafka_raw"
    plugin_output = "json_parsed"
    columns = [
      {
        src_field = "data"
        path = "$.id"
        dest_field = "id"
        dest_type = "bigint"
      },
      {
        src_field = "data"
        path = "$.customer_id"
        dest_field = "customer_id"
        dest_type = "bigint"
      },
      {
        src_field = "data"
        path = "$.total_amount"
        dest_field = "total_amount"
        dest_type = "decimal(16,2)"
      },
      {
        src_field = "data"
        path = "$.event_date"
        dest_field = "event_date"
        dest_type = "string"
      }
    ]
  }
  Sql {
    plugin_input = "json_parsed"
    plugin_output = "orders_sql"
    query = "select id, customer_id, total_amount, event_date from json_parsed"
  }
}

sink {
  Iceberg {
    plugin_input = "orders_sql"
    catalog_name = "seatunnel_demo"
    namespace = "lakehouse"
    table = "orders"
    iceberg.catalog.config = {
      type = "hadoop"
      warehouse = "file:///tmp/seatunnel/iceberg/warehouse-demo"
    }
    iceberg.table.primary-keys = "id"
    iceberg.table.partition-keys = "event_date"
    iceberg.table.upsert-mode-enabled = true
    iceberg.table.schema-evolution-enabled = true
    case_sensitive = true
  }
}
