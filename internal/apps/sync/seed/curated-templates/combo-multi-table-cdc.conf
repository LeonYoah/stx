# combo · 多表 CDC → JDBC
# curated-section: combo | MySQL-CDC,Jdbc | multi
# source: https://seatunnel.apache.org/zh-CN/docs/3.0.0/getting-started/recipes/multi-table-cdc
#
# 来自 SeaTunnel 3.0.0 官方场景教程，主机名/账号为文档示例，接入前请按环境替换。
# From SeaTunnel 3.0.0 official recipes; replace hosts/credentials for your environment.

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  MySQL-CDC {
    plugin_output = "mysql_multi"
    startup.mode = "initial"
    server-id = 5652
    username = "st_user_source"
    password = "mysqlpw"
    database-pattern = "inventory"
    table-pattern = "inventory\\.(orders|customers|products)"
    url = "jdbc:mysql://mysql:3306/inventory"
  }
}

sink {
  Jdbc {
    plugin_input = "mysql_multi"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://postgresql:5432/sync_demo"
    username = "st_user_sink"
    password = "pgpw"
    generate_sink_sql = true
    database = "sync_demo"
    table = "public.st_${table_name}"
    primary_keys = ["${primary_key}"]
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
