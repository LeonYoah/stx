services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: stx-metrics-real-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms256m
    networks:
      - metrics-real
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  seatunnel:
    image: apache/seatunnel:3.1.0
    container_name: stx-metrics-real-seatunnel
    ports:
      - "${STX_METRICS_REAL_REST_PORT:-28180}:8080"
    volumes:
      - ./jobs:/jobs:ro
      - warehouse:/tmp/seatunnel/iceberg/warehouse-demo
    networks:
      - metrics-real
    depends_on:
      kafka:
        condition: service_healthy
    command: ["./bin/seatunnel-cluster.sh"]

networks:
  metrics-real:
    name: stx-metrics-real-net

volumes:
  warehouse:
