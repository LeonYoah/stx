# sink · Hive Kerberos
# curated-section: sink | Hive | kerberos
# 路径类写死示例；无密码字段。若 keytab 需变量化可再改。

Hive {
  plugin_input = ["src"]
  table_name = "default.seatunnel_users"
  metastore_uri = "thrift://metastore:9083"
  hive_site_path = "/etc/hive/conf/hive-site.xml"
  kerberos_principal = "hive/metastore.seatunnel@EXAMPLE.COM"
  kerberos_keytab_path = "/etc/security/keytabs/hive.service.keytab"
  krb5_path = "/etc/krb5.conf"
}
