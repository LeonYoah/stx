global:
  resolve_timeout: 5m

route:
  receiver: stx-webhook
  group_by: [alertname, cluster, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 10m

receivers:
  - name: stx-webhook
    webhook_configs:
      - url: http://stx-backend:17800/api/v1/monitoring/alertmanager/webhook
        send_resolved: true
