name: CI on main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    name: License Policy Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Check license policy for pull request changes
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_license.py --base-ref "origin/${{ github.base_ref }}" --head-ref "${{ github.sha }}"

      - name: Check license policy for push changes
        if: github.event_name == 'push'
        run: python3 scripts/check_license.py --base-ref "${{ github.event.before }}" --head-ref "${{ github.sha }}"

      - name: Check database dialect compatibility
        run: python3 scripts/check_db_compatibility.py

  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend/backend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-main.yml'
              - 'scripts/restart.sh'
            backend:
              - 'internal/**'
              - 'agent/**'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/check_db_compatibility.py'
              - '.github/workflows/ci-main.yml'
              - 'scripts/restart.sh'

  backend-core-test:
    name: Backend Core & Multi-DB Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stx
          POSTGRES_PASSWORD: stx_password_2026
          POSTGRES_DB: stx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stx_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run backend tests
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_USER: stx
          TEST_POSTGRES_PASSWORD: stx_password_2026
          TEST_POSTGRES_DB: stx
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
          TEST_MYSQL_DB: stx_test
        run: go test ./... -count=1

  agent-test:
    name: Agent Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run agent tests
        run: |
          cd agent
          go test ./... -count=1

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm run test -- --passWithNoTests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build standalone frontend
        run: |
          cd frontend
          pnpm run pack:standalone

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, backend-core-test, agent-test, frontend-unit, frontend-build]
    if: always()

    steps:
      - name: Evaluate CI gate
        run: |
          echo "backend=${{ needs.changes.outputs.backend }}"
          echo "backend_core_result=${{ needs.backend-core-test.result }}"
          echo "agent_result=${{ needs.agent-test.result }}"
          echo "frontend=${{ needs.changes.outputs.frontend }}"
          echo "frontend_unit_result=${{ needs.frontend-unit.result }}"
          echo "frontend_build_result=${{ needs.frontend-build.result }}"

          if [ "${{ needs.changes.outputs.backend }}" = "true" ] &&
             [ "${{ needs.backend-core-test.result }}" != "success" ]; then
            echo "::error::Backend Core Tests did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.backend }}" = "true" ] &&
             [ "${{ needs.agent-test.result }}" != "success" ]; then
            echo "::error::Agent Tests did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.frontend }}" = "true" ] &&
             [ "${{ needs.frontend-unit.result }}" != "success" ]; then
            echo "::error::Frontend Unit Tests did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.frontend }}" = "true" ] &&
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "::error::Frontend Build did not succeed."
            exit 1
          fi

          echo "All required CI suites succeeded."
