# combo · LocalFile → StarRocks
# curated-section: combo | LocalFile,StarRocks | single
# source: https://seatunnel.apache.org/zh-CN/docs/3.0.0/getting-started/recipes/file-to-starrocks
#
# 来自 SeaTunnel 3.0.0 官方场景教程，主机名/账号为文档示例，接入前请按环境替换。
# From SeaTunnel 3.0.0 official recipes; replace hosts/credentials for your environment.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    plugin_output = "customers_file"
    path = "/tmp/seatunnel/input/customers.csv"
    file_format_type = "csv"
    csv_use_header_line = true
    schema = {
      fields {
        id = bigint
        name = string
        city = string
        updated_at = timestamp
      }
    }
  }
}

sink {
  StarRocks {
    plugin_input = "customers_file"
    nodeUrls = ["starrocks-fe:8030"]
    base-url = "jdbc:mysql://starrocks-fe:9030/sync_demo"
    username = "root"
    password = ""
    database = "sync_demo"
    table = "customers"
    batch_max_rows = 1000
    schema_save_mode = "IGNORE"
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
  }
}
